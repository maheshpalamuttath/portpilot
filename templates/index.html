<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PortPilot</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            margin: 0;

            background: #f5f7fa;

            color: #222;

        }


        header {

            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #1f2937
                );

            color: white;

            padding: 22px 30px;

            box-shadow:
                0 2px 10px
                rgba(0,0,0,.15);

        }


        header h1 {

            margin: 0;

            font-size: 26px;

        }


        header p {

            margin:
                5px 0 0;

            color: #cbd5e1;

            font-size: 14px;

        }


        .container {

            max-width: 1400px;

            margin:
                30px auto;

            padding:
                0 20px;

        }


        /* =====================================================
           CARDS
           ===================================================== */

        .cards {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        180px,
                        1fr
                    )
                );

            gap: 15px;

            margin-bottom: 25px;

        }


        .card {

            background: white;

            padding: 20px;

            border-radius: 12px;

            box-shadow:
                0 2px 10px
                rgba(0,0,0,.06);

        }


        .card-title {

            color: #64748b;

            font-size: 14px;

            margin-bottom: 8px;

        }


        .number {

            font-size: 30px;

            font-weight: 700;

        }


        /* =====================================================
           TOOLBAR
           ===================================================== */

        .toolbar {

            display: flex;

            gap: 10px;

            margin-bottom: 20px;

            flex-wrap: wrap;

        }


        input {

            padding:
                11px 14px;

            border:
                1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;

            min-width: 280px;

            outline: none;

        }


        input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37,99,235,.12);

        }


        button {

            padding:
                11px 16px;

            border: none;

            border-radius: 8px;

            background: #111827;

            color: white;

            cursor: pointer;

            font-size: 14px;

        }


        button:hover {

            background: #2563eb;

        }


        /* =====================================================
           MESSAGE
           ===================================================== */

        #message {

            margin:
                10px 0 15px;

            color: #64748b;

            font-size: 14px;

        }


        /* =====================================================
           TABLE
           ===================================================== */

        .table-wrapper {

            overflow-x: auto;

            border-radius: 12px;

            box-shadow:
                0 2px 10px
                rgba(0,0,0,.06);

        }


        table {

            width: 100%;

            border-collapse: collapse;

            background: white;

        }


        th,
        td {

            padding:
                13px 15px;

            border-bottom:
                1px solid #edf0f2;

            text-align: left;

            white-space: nowrap;

        }


        th {

            background: #f8fafc;

            color: #64748b;

            font-size: 13px;

            text-transform: uppercase;

            letter-spacing: .03em;

        }


        tbody tr:hover {

            background: #f8fafc;

        }


        /* =====================================================
           SECTION HEADERS
           ===================================================== */

        .docker-section {

            background: #eaf3ff;

            color: #1877f2;

            font-weight: 700;

            padding: 14px 15px;

        }


        .host-section {

            background: #f1f5f9;

            color: #475569;

            font-weight: 700;

            padding: 14px 15px;

        }


        /* =====================================================
           SOURCE
           ===================================================== */

        .docker {

            color: #1877f2;

            font-weight: 700;

        }


        .host {

            color: #64748b;

            font-weight: 700;

        }


        /* =====================================================
           STATUS
           ===================================================== */

        .status {

            color: #059669;

            font-weight: 600;

        }


        /* =====================================================
           EMPTY
           ===================================================== */

        .empty {

            text-align: center;

            padding: 40px;

            color: #64748b;

        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (
            max-width: 700px
        ) {

            .container {

                margin-top: 20px;

            }


            input {

                width: 100%;

                min-width: 0;

            }


            button {

                flex: 1;

            }

        }

    </style>

</head>


<body>


<header>

    <h1>🔌 PortPilot</h1>

    <p>
        Host and Docker port manager
    </p>

</header>


<div class="container">


    <!-- =====================================================
         STATISTICS
         ===================================================== -->

    <div class="cards">


        <div class="card">

            <div class="card-title">
                Ports in use
            </div>

            <div
                class="number"
                id="usedCount"
            >
                0
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                TCP
            </div>

            <div
                class="number"
                id="tcpCount"
            >
                0
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                UDP
            </div>

            <div
                class="number"
                id="udpCount"
            >
                0
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                Docker
            </div>

            <div
                class="number"
                id="dockerCount"
            >
                0
            </div>

        </div>


    </div>


    <!-- =====================================================
         TOOLBAR
         ===================================================== -->

    <div class="toolbar">


        <input
            type="text"
            id="search"
            placeholder="Search port, service, container..."
            onkeyup="filterTable()"
        >


        <button
            onclick="loadPorts()"
        >
            🔄 Refresh
        </button>


        <button
            onclick="findPorts()"
        >
            🔎 Find Available Ports
        </button>


    </div>


    <div id="message"></div>


    <!-- =====================================================
         PORT TABLE
         ===================================================== -->

    <div class="table-wrapper">

        <table>

            <thead>

                <tr>

                    <th>
                        Port
                    </th>

                    <th>
                        Protocol
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Source
                    </th>

                    <th>
                        Process / Container
                    </th>

                    <th>
                        Address
                    </th>

                </tr>

            </thead>


            <tbody
                id="portTable"
            ></tbody>

        </table>

    </div>


</div>


<script>


let allPorts = [];


/* ============================================================
   LOAD PORTS
   ============================================================ */

async function loadPorts() {

    document.getElementById(
        "message"
    ).innerText =
        "Scanning host...";


    try {

        const response =
            await fetch(
                "/api/ports"
            );


        allPorts =
            await response.json();


        renderTable(
            allPorts
        );


        document.getElementById(
            "message"
        ).innerText =
            "Scan completed.";


    } catch (error) {

        document.getElementById(
            "message"
        ).innerText =
            "Unable to scan ports.";

        console.error(
            error
        );

    }

}


/* ============================================================
   RENDER TABLE
   ============================================================ */

function renderTable(ports) {


    const table =
        document.getElementById(
            "portTable"
        );


    table.innerHTML = "";


    let tcp = 0;

    let udp = 0;

    let docker = 0;


    /* ========================================================
       COUNTS
       ======================================================== */

    ports.forEach(
        item => {

            if (
                item.protocol === "TCP"
            ) {

                tcp++;

            }


            if (
                item.protocol === "UDP"
            ) {

                udp++;

            }


            if (
                item.source === "Docker"
            ) {

                docker++;

            }

        }
    );


    /* ========================================================
       SORT
       
       Docker first
       Host second
       Port number ascending
       ======================================================== */

    ports.sort(
        (a, b) => {


            if (
                a.source !==
                b.source
            ) {

                return (
                    a.source === "Docker"
                    ? -1
                    : 1
                );

            }


            return (
                Number(a.port)
                -
                Number(b.port)
            );

        }
    );


    /* ========================================================
       EMPTY
       ======================================================== */

    if (
        ports.length === 0
    ) {

        table.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="empty"
                >
                    No ports found.
                </td>

            </tr>

        `;

    }


    let currentSource =
        "";


    /* ========================================================
       ROWS
       ======================================================== */

    ports.forEach(
        item => {


            /* ------------------------------------------------
               SECTION HEADER
               ------------------------------------------------ */

            if (
                item.source !==
                currentSource
            ) {


                currentSource =
                    item.source;


                const section =
                    document.createElement(
                        "tr"
                    );


                if (
                    item.source ===
                    "Docker"
                ) {


                    section.innerHTML = `

                        <td
                            colspan="6"
                            class="docker-section"
                        >

                            🐳 DOCKER PORTS

                        </td>

                    `;


                } else {


                    section.innerHTML = `

                        <td
                            colspan="6"
                            class="host-section"
                        >

                            🖥️ HOST PORTS

                        </td>

                    `;

                }


                table.appendChild(
                    section
                );

            }


            /* ------------------------------------------------
               SERVICE
               ------------------------------------------------ */

            let service =
                item.process ||
                "-";


            /* ------------------------------------------------
               ROW
               ------------------------------------------------ */

            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td>

                    <strong>
                        ${item.port}
                    </strong>

                </td>


                <td>
                    ${item.protocol}
                </td>


                <td class="status">

                    🟢 USED

                </td>


                <td class="${
                    item.source ===
                    "Docker"
                    ? "docker"
                    : "host"
                }">

                    ${item.source}

                </td>


                <td>

                    ${service}

                </td>


                <td>

                    ${item.address}

                </td>

            `;


            table.appendChild(
                row
            );

        }
    );


    /* ========================================================
       UPDATE CARDS
       ======================================================== */

    document.getElementById(
        "usedCount"
    ).innerText =
        ports.length;


    document.getElementById(
        "tcpCount"
    ).innerText =
        tcp;


    document.getElementById(
        "udpCount"
    ).innerText =
        udp;


    document.getElementById(
        "dockerCount"
    ).innerText =
        docker;

}


/* ============================================================
   SEARCH
   ============================================================ */

function filterTable() {


    const search =
        document
            .getElementById(
                "search"
            )
            .value
            .toLowerCase();


    const filtered =
        allPorts.filter(
            item => {

                return JSON
                    .stringify(
                        item
                    )
                    .toLowerCase()
                    .includes(
                        search
                    );

            }
        );


    renderTable(
        filtered
    );

}


/* ============================================================
   FIND AVAILABLE PORTS
   ============================================================ */

async function findPorts() {


    const response =
        await fetch(
            "/api/find-port?start=8000&end=9000"
        );


    const data =
        await response.json();


    document.getElementById(
        "message"
    ).innerText =
        "Available ports: " +
        data.available.join(
            ", "
        );

}


/* ============================================================
   INITIAL LOAD
   ============================================================ */

loadPorts();


</script>


</body>

</html>
